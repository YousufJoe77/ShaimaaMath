
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسليم الواجب</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* ================= BODY ================= */

    body {
      font-family: "Cairo", sans-serif;

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          rgba(15, 23, 42, 0.72),
          rgba(30, 41, 59, 0.58)
        ),
        url("—Pngtree—back to school chalkboard with_16297416.jpeg")
        center center / cover no-repeat fixed;

      color: #172033;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 35px 15px;
    }


    /* ================= CONTAINER ================= */

    .container {
      width: 100%;
      max-width: 680px;
    }


    /* ================= CARD ================= */

    .card {
      position: relative;

      background: rgba(255, 255, 255, 0.95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.7);

      border-radius: 30px;

      padding: 40px;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.25),
        0 8px 25px rgba(15, 23, 42, 0.12);

      overflow: hidden;
    }


    /* ================= DECORATION ================= */

    .card::before {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      top: -100px;
      right: -80px;

      background: #6366f1;

      opacity: 0.08;

      border-radius: 50%;

      pointer-events: none;
    }


    .card::after {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      bottom: -80px;
      left: -70px;

      background: #8b5cf6;

      opacity: 0.07;

      border-radius: 50%;

      pointer-events: none;
    }


    /* ================= HEADER ================= */

    .header {
      position: relative;

      z-index: 2;

      text-align: center;

      margin-bottom: 32px;
    }


    .logo {
      width: 82px;
      height: 82px;

      margin: 0 auto 18px;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #7c3aed
        );

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 32px;
      font-weight: 800;

      box-shadow:
        0 15px 35px rgba(79, 70, 229, 0.30);

      transform: rotate(-3deg);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }


    .logo:hover {
      transform: rotate(0deg) scale(1.05);

      box-shadow:
        0 18px 40px rgba(79, 70, 229, 0.35);
    }


    .header h1 {
      font-size: 30px;

      font-weight: 900;

      color: #111827;

      margin-bottom: 7px;

      letter-spacing: -0.5px;
    }


    .header p {
      color: #64748b;

      font-size: 14px;

      line-height: 1.8;
    }


    /* ================= FORM ================= */

    .form-group {
      position: relative;

      z-index: 2;

      margin-bottom: 21px;
    }


    label {
      display: block;

      margin-bottom: 9px;

      font-size: 14px;

      font-weight: 800;

      color: #334155;
    }


    /* ================= INPUTS ================= */

    input,
    select {
      width: 100%;

      height: 54px;

      border: 1.5px solid #e2e8f0;

      border-radius: 15px;

      padding: 0 17px;

      font-family: inherit;

      font-size: 14px;

      background: #ffffff;

      color: #172033;

      outline: none;

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.2s ease;
    }


    input::placeholder {
      color: #a1a9b8;
    }


    input:hover,
    select:hover {
      border-color: #c7d2fe;
    }


    input:focus,
    select:focus {
      border-color: #6366f1;

      box-shadow:
        0 0 0 4px rgba(99, 102, 241, 0.10),
        0 5px 15px rgba(99, 102, 241, 0.06);

      transform: translateY(-1px);
    }


    /* ================= UPLOAD ================= */

    .upload-area {
      position: relative;

      z-index: 2;

      display: block;

      border: 2px dashed #cbd5e1;

      border-radius: 20px;

      padding: 34px 20px;

      text-align: center;

      cursor: pointer;

      transition:
        border-color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;

      background:
        linear-gradient(
          180deg,
          #f8fafc,
          #f1f5f9
        );
    }


    .upload-area:hover {
      border-color: #6366f1;

      background:
        linear-gradient(
          180deg,
          #f8f7ff,
          #eef2ff
        );

      transform: translateY(-2px);

      box-shadow:
        0 10px 25px rgba(99, 102, 241, 0.08);
    }


    .upload-icon {
      width: 62px;
      height: 62px;

      margin: 0 auto 14px;

      border-radius: 18px;

      background: #eef2ff;

      color: #6366f1;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 29px;

      transition: 0.25s ease;
    }


    .upload-area:hover .upload-icon {
      background: #6366f1;

      color: white;

      transform: translateY(-3px);
    }


    .upload-area h3 {
      font-size: 16px;

      color: #334155;

      margin-bottom: 6px;

      font-weight: 800;
    }


    .upload-area p {
      font-size: 12px;

      color: #94a3b8;

      line-height: 1.7;
    }


    #files {
      display: none;
    }


    /* ================= FILE LIST ================= */

    .file-list {
      margin-top: 15px;

      display: none;
    }


    .file-item {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      background: #f8fafc;

      border: 1px solid #e2e8f0;

      padding: 12px 14px;

      border-radius: 14px;

      margin-bottom: 8px;

      transition: 0.2s ease;
    }


    .file-item:hover {
      border-color: #c7d2fe;

      background: #f8f7ff;
    }


    .file-name {
      font-size: 13px;

      font-weight: 700;

      color: #334155;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    .file-size {
      color: #94a3b8;

      font-size: 11px;

      white-space: nowrap;
    }


    /* ================= BUTTON ================= */

    .submit-btn {
      position: relative;

      z-index: 2;

      width: 100%;

      height: 57px;

      border: none;

      border-radius: 16px;

      margin-top: 12px;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #7c3aed
        );

      color: white;

      font-family: inherit;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;

      box-shadow:
        0 12px 28px rgba(79, 70, 229, 0.25);
    }


    .submit-btn:hover {
      transform: translateY(-3px);

      filter: brightness(1.05);

      box-shadow:
        0 16px 35px rgba(79, 70, 229, 0.32);
    }


    .submit-btn:active {
      transform: translateY(0);
    }


    .submit-btn:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;

      filter: none;
    }


    /* ================= MESSAGE ================= */

    .message {
      display: none;

      margin-top: 18px;

      padding: 15px 17px;

      border-radius: 14px;

      text-align: center;

      font-size: 13px;

      font-weight: 800;

      line-height: 1.7;
    }


    .success {
      background: #ecfdf5;

      color: #047857;

      border: 1px solid #a7f3d0;
    }


    .error {
      background: #fef2f2;

      color: #b91c1c;

      border: 1px solid #fecaca;
    }


    /* ================= FOOTER ================= */

    .footer {
      position: relative;

      z-index: 2;

      text-align: center;

      margin-top: 22px;

      color: #94a3b8;

      font-size: 11px;
    }


    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      body {
        padding: 15px 10px;

        background-attachment: scroll;
      }


      .card {
        padding: 28px 18px;

        border-radius: 24px;
      }


      .header {
        margin-bottom: 27px;
      }


      .logo {
        width: 72px;
        height: 72px;

        border-radius: 21px;

        font-size: 28px;
      }


      .header h1 {
        font-size: 24px;
      }


      .header p {
        font-size: 13px;
      }


      input,
      select {
        height: 52px;

        border-radius: 14px;
      }


      .upload-area {
        padding: 28px 15px;
      }


      .submit-btn {
        height: 54px;
      }

    }


    /* ================= SMALL PHONES ================= */

    @media (max-width: 380px) {

      .card {
        padding: 24px 15px;
      }


      .header h1 {
        font-size: 22px;
      }


      .upload-area {
        padding: 25px 12px;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <div class="header">

        <h1>
          Miss ElShaimaa Mohamed
        </h1>

        <p>
          قم بإرسال الواجب الخاص بك من هنا
        </p>

      </div>


      <form id="homeworkForm">

        <!-- اسم الطالب -->
        <div class="form-group">

          <label for="studentName">
            اسم الطالب
          </label>

          <input
            type="text"
            id="studentName"
            name="studentName"
            placeholder="اكتب اسمك بالكامل"
            required
          >

        </div>


        <!-- المرحلة -->
        <div class="form-group">

          <label for="stage">
            المرحلة الدراسية
          </label>

          <select
            id="stage"
            name="stage"
            required
          >

            <option value="">
              اختر المرحلة
            </option>

            <option value="Grade 4">
              Grade 4
            </option>

            <option value="Grade 5">
              Grade 5
            </option>

            <option value="Grade 6">
              Grade 6
            </option>

            <option value="Grade 7">
              Grade 7
            </option>

            <option value="Grade 8">
              Grade 8
            </option>

            <option value="Grade 9">
              Grade 9
            </option>

            <option value="IG Grade 10">
              IG Grade 10
            </option>

            <option value="IG Grade 11">
              IG Grade 11
            </option>

          </select>

        </div>


        <!-- الملفات -->
        <div class="form-group">

          <label>
            ملفات الواجب
          </label>


          <label
            class="upload-area"
            for="files"
          >

            <div class="upload-icon">
              📚
            </div>

            <h3>
              اضغط هنا لاختيار ملفات الواجب
            </h3>

            <p>
              يمكنك اختيار أكثر من ملف
            </p>

          </label>


          <input
            type="file"
            id="files"
            name="files"
            multiple
          >


          <div
            id="fileList"
            class="file-list"
          ></div>

        </div>


        <!-- زر الإرسال -->
        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >
          إرسال الواجب
        </button>

      </form>


      <!-- رسالة النجاح -->
      <div
        id="successMessage"
        class="message success"
      >
        تم إرسال الواجب بنجاح ✅
      </div>


      <!-- رسالة الخطأ -->
      <div
        id="errorMessage"
        class="message error"
      >
        حدث خطأ أثناء إرسال الواجب ❌
      </div>

    </div>


    <div class="footer">
      ميس شيماء ماث © 2026
    </div>

  </div>


  <!-- =========================================
       SUPABASE CDN
  ========================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // =========================================
    // SUPABASE
    // =========================================

    const SUPABASE_URL =
      "https://cvnuvpufmhnbqqaijkon.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_m9cqEKWKkjDOizTNzvk4eQ_2AFu9rH0";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // =========================================
    // ELEMENTS
    // =========================================

    const form =
      document.getElementById("homeworkForm");

    const filesInput =
      document.getElementById("files");

    const fileList =
      document.getElementById("fileList");

    const submitBtn =
      document.getElementById("submitBtn");

    const successMessage =
      document.getElementById("successMessage");

    const errorMessage =
      document.getElementById("errorMessage");


    // =========================================
    // SHOW SELECTED FILES
    // =========================================

    filesInput.addEventListener(
      "change",
      function () {

        fileList.innerHTML = "";


        if (filesInput.files.length === 0) {

          fileList.style.display = "none";

          return;
        }


        fileList.style.display = "block";


        Array.from(filesInput.files).forEach(
          function (file) {

            const item =
              document.createElement("div");

            item.className =
              "file-item";


            const name =
              document.createElement("div");

            name.className =
              "file-name";

            name.textContent =
              file.name;


            const size =
              document.createElement("div");

            size.className =
              "file-size";

            size.textContent =
              formatFileSize(file.size);


            item.appendChild(name);

            item.appendChild(size);

            fileList.appendChild(item);

          }
        );

      }
    );


    // =========================================
    // FORMAT FILE SIZE
    // =========================================

    function formatFileSize(bytes) {

      if (bytes < 1024) {

        return bytes + " B";

      }


      if (bytes < 1024 * 1024) {

        return (
          bytes / 1024
        ).toFixed(1) + " KB";

      }


      return (
        bytes / (1024 * 1024)
      ).toFixed(1) + " MB";

    }


    // =========================================
    // HIDE MESSAGES
    // =========================================

    function hideMessages() {

      successMessage.style.display =
        "none";

      errorMessage.style.display =
        "none";

    }


    // =========================================
    // CLEAN FILE NAME
    // =========================================

    function cleanFileName(fileName) {

      return fileName
        .replace(
          /[^\u0600-\u06FFa-zA-Z0-9._-]/g,
          "_"
        )
        .replace(
          /_+/g,
          "_"
        );

    }


    // =========================================
    // SUBMIT HOMEWORK
    // =========================================

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        hideMessages();


        const studentName =
          document
            .getElementById("studentName")
            .value
            .trim();


        const stage =
          document
            .getElementById("stage")
            .value;


        // =====================================
        // VALIDATION
        // =====================================

        if (!studentName) {

          errorMessage.textContent =
            "من فضلك اكتب اسم الطالب";

          errorMessage.style.display =
            "block";

          return;

        }


        if (!stage) {

          errorMessage.textContent =
            "من فضلك اختر المرحلة الدراسية";

          errorMessage.style.display =
            "block";

          return;

        }


        if (filesInput.files.length === 0) {

          errorMessage.textContent =
            "من فضلك اختر ملف واحد على الأقل";

          errorMessage.style.display =
            "block";

          return;

        }


        // =====================================
        // START UPLOAD
        // =====================================

        submitBtn.disabled = true;

        submitBtn.textContent =
          "جاري إرسال الواجب...";


        let submissionId = null;

        const uploadedPaths = [];


        try {

          // ===================================
          // 1. CREATE SUBMISSION
          // ===================================

          const {
            data: submission,
            error: submissionError
          } =
            await supabaseClient
              .from("submissions")
              .insert({
                student_name: studentName,
                stage: stage
              })
              .select("id")
              .single();


          if (submissionError) {

            console.error(
              "Submission error:",
              submissionError
            );

            throw new Error(
              "فشل إنشاء بيانات الطالب: " +
              submissionError.message
            );

          }


          submissionId =
            submission.id;


          // ===================================
          // 2. UPLOAD FILES
          // ===================================

          for (
            const file
            of Array.from(filesInput.files)
          ) {

            const safeFileName =
              cleanFileName(
                file.name
              );


            const uniqueName =
              `${Date.now()}-${crypto.randomUUID()}-${safeFileName}`;


            const storagePath =
              `${submissionId}/${uniqueName}`;


            const {
              error: uploadError
            } =
              await supabaseClient
                .storage
                .from("homework")
                .upload(
                  storagePath,
                  file,
                  {
                    cacheControl: "3600",
                    upsert: false
                  }
                );


            if (uploadError) {

              console.error(
                "Storage upload error:",
                uploadError
              );

              throw new Error(
                "فشل رفع الملف " +
                file.name +
                ": " +
                uploadError.message
              );

            }


            uploadedPaths.push(
              storagePath
            );


            // =================================
            // 3. SAVE FILE RECORD
            // =================================

            const {
              error: fileRecordError
            } =
              await supabaseClient
                .from("submission_files")
                .insert({

                  submission_id:
                    submissionId,

                  original_name:
                    file.name,

                  storage_path:
                    storagePath

                });


            if (fileRecordError) {

              console.error(
                "File record error:",
                fileRecordError
              );

              throw new Error(
                "فشل تسجيل الملف " +
                file.name +
                ": " +
                fileRecordError.message
              );

            }

          }


          // ===================================
          // SUCCESS
          // ===================================

          successMessage.textContent =
            "تم إرسال الواجب بنجاح ✅";

          successMessage.style.display =
            "block";


          form.reset();


          fileList.innerHTML = "";

          fileList.style.display =
            "none";


        } catch (error) {

          console.error(
            "Upload error:",
            error
          );


          // ===================================
          // DELETE UPLOADED FILES
          // ===================================

          if (uploadedPaths.length > 0) {

            const {
              error: cleanupError
            } =
              await supabaseClient
                .storage
                .from("homework")
                .remove(
                  uploadedPaths
                );


            if (cleanupError) {

              console.error(
                "Cleanup error:",
                cleanupError
              );

            }

          }


          // ===================================
          // DELETE SUBMISSION
          // ===================================

          if (submissionId) {

            const {
              error: deleteError
            } =
              await supabaseClient
                .from("submissions")
                .delete()
                .eq(
                  "id",
                  submissionId
                );


            if (deleteError) {

              console.error(
                "Delete submission error:",
                deleteError
              );

            }

          }


          // ===================================
          // SHOW ERROR
          // ===================================

          errorMessage.textContent =
            error.message ||
            "حدث خطأ أثناء إرسال الواجب";

          errorMessage.style.display =
            "block";

        } finally {

          submitBtn.disabled = false;

          submitBtn.textContent =
            "إرسال الواجب";

        }

      }
    );

  </script>

</body>

</html>
