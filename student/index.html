  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // =========================================
    // SUPABASE
    // =========================================

    const SUPABASE_URL =
      "https://cvnuvpufmhnbqqaijkon.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_m9cqEKWKkjDOizTNzvk4eQ_2AFu9rH0";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // =========================================
    // ELEMENTS
    // =========================================

    const form =
      document.getElementById("homeworkForm");

    const filesInput =
      document.getElementById("files");

    const fileList =
      document.getElementById("fileList");

    const submitBtn =
      document.getElementById("submitBtn");

    const successMessage =
      document.getElementById("successMessage");

    const errorMessage =
      document.getElementById("errorMessage");


    // =========================================
    // SHOW SELECTED FILES
    // =========================================

    filesInput.addEventListener(
      "change",
      function () {

        fileList.innerHTML = "";


        if (filesInput.files.length === 0) {

          fileList.style.display = "none";

          return;
        }


        fileList.style.display = "block";


        Array.from(filesInput.files).forEach(
          function (file) {

            const item =
              document.createElement("div");

            item.className =
              "file-item";


            const name =
              document.createElement("div");

            name.className =
              "file-name";

            name.textContent =
              file.name;


            const size =
              document.createElement("div");

            size.className =
              "file-size";

            size.textContent =
              formatFileSize(file.size);


            item.appendChild(name);

            item.appendChild(size);

            fileList.appendChild(item);

          }
        );

      }
    );


    // =========================================
    // FORMAT FILE SIZE
    // =========================================

    function formatFileSize(bytes) {

      if (bytes < 1024) {

        return bytes + " B";

      }


      if (bytes < 1024 * 1024) {

        return (
          bytes / 1024
        ).toFixed(1) + " KB";

      }


      return (
        bytes / (1024 * 1024)
      ).toFixed(1) + " MB";

    }


    // =========================================
    // HIDE MESSAGES
    // =========================================

    function hideMessages() {

      successMessage.style.display =
        "none";

      errorMessage.style.display =
        "none";

    }


    // =========================================
    // CLEAN FILE NAME
    // =========================================

    function cleanFileName(fileName) {

      return fileName
        .replace(
          /[^\u0600-\u06FFa-zA-Z0-9._-]/g,
          "_"
        )
        .replace(
          /_+/g,
          "_"
        );

    }


    // =========================================
    // SUBMIT HOMEWORK
    // =========================================

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        hideMessages();


        const studentName =
          document
            .getElementById("studentName")
            .value
            .trim();


        const stage =
          document
            .getElementById("stage")
            .value;


        // =====================================
        // VALIDATION
        // =====================================

        if (!studentName) {

          errorMessage.textContent =
            "من فضلك اكتب اسم الطالب";

          errorMessage.style.display =
            "block";

          return;

        }


        if (!stage) {

          errorMessage.textContent =
            "من فضلك اختر المرحلة الدراسية";

          errorMessage.style.display =
            "block";

          return;

        }


        if (filesInput.files.length === 0) {

          errorMessage.textContent =
            "من فضلك اختر ملف واحد على الأقل";

          errorMessage.style.display =
            "block";

          return;

        }


        // =====================================
        // START UPLOAD
        // =====================================

        submitBtn.disabled = true;

        submitBtn.textContent =
          "جاري إرسال الواجب...";


        let submissionId = null;

        const uploadedPaths = [];


        try {

          // ===================================
          // 1. CREATE SUBMISSION
          // ===================================

          const {
            data: submission,
            error: submissionError
          } =
            await supabaseClient
              .from("submissions")
              .insert({
                student_name: studentName,
                stage: stage
              })
              .select("id")
              .single();


          if (submissionError) {

            console.error(
              "Submission error:",
              submissionError
            );

            throw new Error(
              "فشل إنشاء بيانات الطالب: " +
              submissionError.message
            );

          }


          submissionId =
            submission.id;


          // ===================================
          // 2. UPLOAD FILES
          // ===================================

          for (
            const file
            of Array.from(filesInput.files)
          ) {

            const safeFileName =
              cleanFileName(
                file.name
              );


            const uniqueName =
              `${Date.now()}-${crypto.randomUUID()}-${safeFileName}`;


            const storagePath =
              `${submissionId}/${uniqueName}`;


            const {
              error: uploadError
            } =
              await supabaseClient
                .storage
                .from("homework")
                .upload(
                  storagePath,
                  file,
                  {
                    cacheControl: "3600",
                    upsert: false
                  }
                );


            if (uploadError) {

              console.error(
                "Storage upload error:",
                uploadError
              );

              throw new Error(
                "فشل رفع الملف " +
                file.name +
                ": " +
                uploadError.message
              );

            }


            uploadedPaths.push(
              storagePath
            );


            // =================================
            // 3. SAVE FILE RECORD
            // =================================

            const {
              error: fileRecordError
            } =
              await supabaseClient
                .from("submission_files")
                .insert({

                  submission_id:
                    submissionId,

                  original_name:
                    file.name,

                  storage_path:
                    storagePath

                });


            if (fileRecordError) {

              console.error(
                "File record error:",
                fileRecordError
              );

              throw new Error(
                "فشل تسجيل الملف " +
                file.name +
                ": " +
                fileRecordError.message
              );

            }

          }


          // ===================================
          // SUCCESS
          // ===================================

          successMessage.textContent =
            "تم إرسال الواجب بنجاح ✅";

          successMessage.style.display =
            "block";


          form.reset();


          fileList.innerHTML = "";

          fileList.style.display =
            "none";


        } catch (error) {

          console.error(
            "Upload error:",
            error
          );


          // ===================================
          // DELETE UPLOADED FILES
          // ===================================

          if (uploadedPaths.length > 0) {

            const {
              error: cleanupError
            } =
              await supabaseClient
                .storage
                .from("homework")
                .remove(
                  uploadedPaths
                );


            if (cleanupError) {

              console.error(
                "Cleanup error:",
                cleanupError
              );

            }

          }


          // ===================================
          // DELETE SUBMISSION
          // ===================================

          if (submissionId) {

            const {
              error: deleteError
            } =
              await supabaseClient
                .from("submissions")
                .delete()
                .eq(
                  "id",
                  submissionId
                );


            if (deleteError) {

              console.error(
                "Delete submission error:",
                deleteError
              );

            }

          }


          // ===================================
          // SHOW ERROR
          // ===================================

          errorMessage.textContent =
            error.message ||
            "حدث خطأ أثناء إرسال الواجب";

          errorMessage.style.display =
            "block";

        } finally {

          submitBtn.disabled = false;

          submitBtn.textContent =
            "إرسال الواجب";

        }

      }
    );

  </script>

</body>

</html>
